# See ../../schema/poc.schema.json and ../../SAFETY.md.
id: cli-raw-stdin-paste
title: "Standalone CLI: pasted stdin burst must not keep its trailing submit"
class: bracketed-paste-bypass
cve: []
affected:
  - product: "raw-stdin terminal wrappers with no paste/burst distinction"
    tested: false
author: "(pastejacking class; publicly documented)"
source_url: "https://secure-terminal.github.io"
archive_url: "TODO"
date: "2021"
severity: injection
mechanism: cli-stdin-burst-submit
verification: cli-paste-autoexec
payload_encoding: hex
expected_effect: >-
  The standalone secure-terminal CLI runs the child under TERM=dumb (bracketed
  paste off), so a pasted stdin burst ending in a submit byte would auto-run the
  command. secure-terminal treats a multi-byte burst ending in a submit as a paste
  and drops the trailing submit (_strip_burst_submit), so the command waits at the
  prompt for the user's own Enter.
canary: "POC-CORPUS-CANARY-FIRED"
modified: true
original_ref: >-
  The upstream pastejacking class delivers an arbitrary command as one burst; here
  the burst body is the safe canary marker-write only.
notes: >-
  Real-effect oracle for the cli.py path: a hit = the forwarded burst still ends in
  a submit byte (auto-run). Exercises _strip_burst_submit, the CLI write choke point.
