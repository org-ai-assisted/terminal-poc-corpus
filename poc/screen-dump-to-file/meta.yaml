id: screen-dump-to-file
title: "DEC/xterm Media Copy (printer controller) copies the screen to a file"
class: screen-dump-to-file
cve: []
affected:
  - product: "terminals implementing Media Copy / printer-controller mode (DEC/xterm)"
    tested: false
author: "(screen-dump-to-file via Media Copy; documented class)"
source_url: "https://secure-terminal.github.io"
archive_url: "TODO"
date: "2024"
severity: exfil
mechanism: media-copy-printer-controller
payload_encoding: hex
verification: screen-dump-to-file
expected_effect: >-
  The Media Copy escapes turn the printer controller on (ESC [ ? 5 i), print the
  screen (ESC [ i) and turn it off (ESC [ 4 i). On a terminal that implements
  printer/Media Copy support, output is copied to the configured printer command or
  file, silently exfiltrating on-screen content. secure-terminal has no printer path
  and strips every escape, so no Media Copy sequence survives the render.
